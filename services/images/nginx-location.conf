# Include inside the existing CPU Inference nginx server. No additional LAN port.
location /api/images/ {
    # 8 MiB input becomes ~10.7 MiB base64; the application also bounds/decodes it.
    client_max_body_size 12m;
    proxy_pass http://127.0.0.1:18084/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 11m;
    proxy_send_timeout 30s;
    proxy_buffering off;
    proxy_cache off;
}
