<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101512">
  <title>Enki — управление</title>
  <link rel="stylesheet" href="/remote.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Enki <span>Remote</span></div>
    <select id="device-select" aria-label="Компьютер"></select>
    <span id="connection" class="connection" title="Связь с Hub"></span>
    <button class="icon" data-action="settings" aria-label="Настройки и обновления">⚙</button>
  </header>

  <main class="app">
    <section class="session-bar">
      <button id="session-picker" class="session-picker" data-action="sessions">
        <span class="picker-eyebrow">Сессия</span>
        <strong id="session-title">Выбрать сессию</strong>
        <small id="session-path"></small>
      </button>
      <span id="session-status" class="status"></span>
      <button class="new-button" data-action="new" aria-label="Новое задание">＋</button>
    </section>

    <div id="alerts" class="alerts"></div>
    <div id="messages" class="messages">
      <div id="empty" class="empty">
        <div class="empty-mark">⌁</div>
        <h1>Выберите сессию</h1>
        <p>Или начните новое задание на любом компьютере.</p>
        <button class="primary" data-action="new">Новое задание</button>
      </div>
    </div>
    <div id="queue" class="queue"></div>

    <form id="composer" class="composer" hidden>
      <div class="composer-box">
        <textarea id="prompt" rows="2" placeholder="Задание или уточнение…"></textarea>
        <div class="composer-tools">
          <select id="model" aria-label="Модель"></select>
          <button id="dictate" type="button" class="tool-button" aria-label="Надиктовать">🎙</button>
          <button type="button" class="tool-button stop-button" data-action="stop">Стоп</button>
          <button type="submit" class="send-button" aria-label="Отправить">↑</button>
        </div>
      </div>
      <div id="dictation-status" class="dictation-status"></div>
    </form>
  </main>

  <dialog id="sessions-dialog" class="sheet">
    <div class="sheet-head">
      <h2>Сессии</h2>
      <button class="icon" data-action="close-sessions" aria-label="Закрыть">×</button>
    </div>
    <input id="session-search" class="search" type="search" placeholder="Название или проект…" autocomplete="off">
    <div class="filters">
      <button class="filter selected" data-filter="all">Все</button>
      <button class="filter" data-filter="busy">Работают</button>
      <button class="filter" data-filter="attention">Ждут ответа</button>
      <button class="filter" data-filter="workshop">Мастерская</button>
    </div>
    <div id="session-results" class="session-results"></div>
  </dialog>

  <dialog id="new-dialog" class="sheet small-sheet">
    <form id="new-form">
      <div class="sheet-head"><h2>Новое задание</h2><button type="button" class="icon" data-action="close-new">×</button></div>
      <label>Компьютер<select id="new-device"></select></label>
      <label>Проект<select id="new-project"></select></label>
      <label>Модель<select id="new-model"></select></label>
      <label>Задание<textarea id="new-prompt" rows="5" required placeholder="Что нужно сделать?"></textarea></label>
      <button class="primary wide" type="submit">Создать и отправить</button>
    </form>
  </dialog>

  <dialog id="settings-dialog" class="sheet settings-sheet">
    <div class="sheet-head"><h2>Настройки</h2><button class="icon" data-action="close-settings">×</button></div>
    <div id="settings-content"></div>
  </dialog>
  <div id="toast" role="status"></div>
  <script src="/remote.js"></script>
</body>
</html>
