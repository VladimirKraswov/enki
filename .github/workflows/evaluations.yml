name: Synthetic evaluation contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Same pinned action commits and exact interpreter as desktop.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run eval:check
      - run: npx vitest run test/evaluations.test.ts
# Live agent trials deliberately have no CI trigger, provider credentials or GPU access.
