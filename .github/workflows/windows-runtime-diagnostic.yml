name: Windows runtime diagnostic (scratch only)
on:
  push:
    branches: [diagnostic/windows-runtime-20261025]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Rust stable with rustfmt and Clippy
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: desktop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-${{ runner.arch }}-
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Complete original native suite on Windows
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo fmt --manifest-path src-tauri/build-runner/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/build-runner/Cargo.toml --all-targets -- -D warnings
      - name: Actual native bootstrap runner Job and NTFS suite
        run: cargo test --locked --manifest-path src-tauri/build-runner/Cargo.toml
# Focused source qualification only. No app/runtime/model/Hub service/owner calls.
