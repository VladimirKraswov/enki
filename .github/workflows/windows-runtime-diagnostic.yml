name: Windows runtime diagnostic (scratch only)

on:
  push:
    branches: [diagnostic/windows-runtime-20261025]

permissions:
  contents: read

concurrency:
  group: windows-runtime-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, same as desktop CI
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, same as desktop CI
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: src-tauri/resources/agent/package-lock.json
      - name: Locked frontend CLI metadata (no app launch)
        run: npm ci
      - name: Rust stable toolchain (same source bootstrap as production)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Every original packaging test with a freshly bootstrapped native Windows port
        env:
          CARGO_BUILD_JOBS: 2
        run: npm run test:runtime-artifact

# Scratch-only finite diagnosis: no app build/install/GUI, credentials,
# owner profiles, Hub, model or real provider calls. Never merge back.
