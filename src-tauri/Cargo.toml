[package]
name = "enki"
version = "2.0.10"
description = "Enki desktop with the bundled Pi SDK agent runtime"
authors = ["Enki contributors"]
edition = "2021"
default-run = "enki"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Enki is the only shipped executable. Old MCP registrations are migrated by
# verified ownership checks; no second launcher is bundled.
[[bin]]
name = "enki"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "enki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
unicode-normalization = "0.1"

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "=2.4.2"
tauri-plugin-clipboard-manager = "=2.3.3"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "blocking", "json"] }
base64 = "0.22"
url = "2"
fs2 = "0.4"
sha2 = "0.10"
unicode-normalization = "=0.1.25"
semver = "1"
rusqlite = { version = "0.38", features = ["bundled", "hooks"] }
tauri-plugin-updater = "2"
minisign-verify = "0.2.5"
getrandom = "0.3"

# Unix only, and only for process-*group* signalling: the agent runtime spawns
# language servers and tools, and killing just the direct child would orphan them.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.build-dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSNotification", "NSOperation", "NSString", "NSObject", "block2"] }
block2 = "0.6"
keyring = { version = "3.6.3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
junction = { version = "1", default-features = false }
keyring = { version = "3.6.3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "1", features = ["macros", "rt"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
